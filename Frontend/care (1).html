fmo(`<h2>حذف ${s.name}</h2>${n?`<p>عندها ${n} مخدومات. المخدومات مش هيتحذفوا — اختاري خادمًا يستلمهم:</p><select id="rs">${o.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select>`:'<p>هل أنت متأكد من حذف هذا الخادم؟</p>'}<div class="hd"><button class="btn gh" onclick="fmc()">إلغاء</button><button class="btn dn" onclick="sd(${id})">${n?'نقل وحذف':'حذف'}</button></div>`)}
function sd(id){const r=$('#rs');if(r)G.forEach(g=>{if(g.srv==id)g.srv=+r.value});S=S.filter(s=>s.id!=id);sv();fmc();render(1);toast('تم حذف الخادم ونقل مخدوماته')}
function asg(id,s){gg(id).srv=+s;sv();render(1);toast('تم تعيين الخادم الجديد')}
function rp(){if(S.length<2){toast('محتاجين خادمين على الأقل للتدوير');return}const c=id=>G.filter(g=>g.srv==id).length;
fmo(mh('معاينة التدوير — '+MO[(mo+1)%4])+`<div class="g two"><div><h4>الحالي</h4>${S.map(s=>`<p><b>${s.name}</b> ← ${c(s.id)} مخدومات</p>`).join('')}</div><div><h4>بعد التدوير</h4>${S.map((s,i)=>{const p=S[(i+S.length-1)%S.length];return `<p><b>${s.name}</b> ← ${c(p.id)} مخدومات <span class="sm">(من مجموعة ${p.name})</span></p>`}).join('')}</div></div><p class="sm">الافتقادات السابقة وبيانات الخادم القديم في خط الزمن ما بتتغيرش، بس المسؤول الحالي.</p><div class="hd"><button class="btn gh" onclick="fmc()">إلغاء</button><button class="btn go" onclick="rotate()">تأكيد التدوير</button></div>`)}
function rotate(){const m=S.map(s=>s.id);G.forEach(g=>{g.srv=m[(m.indexOf(g.srv)+1)%m.length]});mo++;sv();fmc();render(1);toast(`تم تدوير المسؤوليات لشهر ${MO[mo%4]} — كل التاريخ محفوظ`)}
P.rot=()=>{const m=mo&&(G.find(g=>g.pend)||G[0]),o=id=>S.map(s=>`<option value="${s.id}" ${s.id==id?'selected':''}>${s.name}</option>`).join('');
const cols=S.map(s=>{const l=G.filter(g=>g.srv==s.id);return `<div class="c"><h3>${s.name}</h3><small class="mu">${s.fam} — ${l.length} مخدومات</small><div class="hd" style="margin:6px 0"><button class="btn gh" onclick="sf(${s.id})">تعديل</button><button class="btn gh" onclick="sdel(${s.id})">حذف</button></div>${l.map(g=>`<div class="chip">${B(g.cls)}<span style="flex:1;cursor:pointer" onclick="op(${g.id})">${g.name}</span><select class="ms" aria-label="نقل ${g.name}" onchange="asg(${g.id},this.value)">${o(s.id)}</select></div>`).join('')||'<p class="sm">لا توجد مخدومات بعد.</p>'}</div>`}).join('');
return `<h1>توزيع المتابعة</h1><p class="mu">كل خادمة بتتابع مجموعة بالتليفون والرسائل، والمسؤوليات بتتدور كل شهر عشان الكل يعرف الكل.</p><div class="hd"><h2>${MO[mo%4]}</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn gh" onclick="sf()">+ إضافة خادم</button><button class="btn go" onclick="rp()">🔄 تدوير المسؤوليات للشهر القادم</button></div></div><div class="g three">${cols||'<p class="mu">أضيفي خادمًا للبدء.</p>'}</div>`+(m?`<div class="c cc" style="margin-top:14px"><h3>التسليم من غير ما نبدأ من الصفر</h3><p>${sn(m.srv)} استلمت متابعة ${m.name}، وتقدر تشوف فورًا:</p><ul><li>الزيارات السابقة: ${m.tl.length} تواصل مسجّل</li><li>الاحتياج الحالي: ${m.need}</li><li>التدريب الحالي: ${m.rx}</li><li>المتابعة القادمة: ${dtw(m.next)}</li></ul><button class="btn" onclick="op(${m.id})">فتح ملف ${m.name}</button><p class="mu">بيانات العلاقة ملك الخدمة، مش ذاكرة خادم واحد.</p></div>`:'')};
function ap(){const g=gg(A.id),d=A.d;g.tl.push({d,k:A.ty,by:sn(g.srv),n:[A.sum,'الاتفاق: '+A.rx]});g.tl.sort((a,b)=>a.d-b.d);Object.assign(g,{need:A.need.startsWith('يحتاج مزيدًا')?g.need:A.need,rx:A.rx,next:A.nx,nt:'مكالمة',act:A.act,f:Math.max(g.f,d),pend:A.hasRx,fresh:d});if(A.ty!='مكالمة'&&A.ty!='WhatsApp')g.v=Math.max(g.v,d);done++;sv();cv();op(g.id);toast(`تم تحديث ملف ${g.name} والرئيسية ✓`)}
render();
</script></body></html>
